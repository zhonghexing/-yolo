# YOLOv8 钢材表面缺陷检测 Conda 环境配置
# Steel Surface Defect Detection Conda Environment Configuration
# 适用于 RTX 5070 (Blackwell/sm_120)

name: yolo_screw
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python 版本
  - python=3.10

  # PyTorch (RTX 5070 需要 nightly 版本，CUDA 12.4)
  # 如果不是 RTX 5070，可改用稳定版: pytorch>=2.0.0 + pytorch-cuda=12.1
  - pip:
    - --pre torch torchvision --index-url https://download.pytorch.org/whl/nightly/cu124
    - ultralytics>=8.0.0
    - opencv-python>=4.8.0
    - matplotlib>=3.7.0
    - seaborn>=0.12.0
    - scikit-learn>=1.3.0
    - pandas>=2.0.0
    - tqdm>=4.65.0
    - tensorboard>=2.14.0
    - onnx>=1.14.0
    - onnxruntime>=1.15.0
    - Pillow>=10.0.0

  # 开发工具（可选）
  - jupyter
  - ipython
